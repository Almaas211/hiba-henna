<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hiba Henna Shop | هبة حناء</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>
  /* HEADER TEXT (bigger) */

  header .logo {
    font-size: 30px !important;
  }

  header .nav-links a {
    font-size: 19px !important;
  }

  header .cartbtn {
    font-size: 18px !important;
  }

  @media (max-width: 700px) {

    header .logo {
      font-size: 23px !important;
    }

    header .nav-links a {
      font-size: 16px !important;
    }

    header .cartbtn {
      font-size: 16px !important;
    }

  }


  /* TOP BANNER (laptop = wide image, phone = phone-size image) */

  .top-banner {
    width: 100%;
    background: #2b1911;
    line-height: 0;
  }

  .top-banner picture {
    display: block;
  }

  .top-banner img {
    display: block;
    height: auto;
    margin: 0 auto;
    width: min(100%, 1200px, calc((100vh - 130px) * 2));
  }

  @media (max-width: 700px) {

    .top-banner img {
      width: 100%;
    }

  }


  /* =========================================
     DARK BROWN THEME (beige text on dark brown)
     Delete this whole block to go back to the
     light beige theme.
  ========================================= */

  html,
  body {
    background: #2b1911 !important;
    color: #f3e3c3 !important;
  }

  main,
  #shop {
    background: #2b1911 !important;
  }

  header {
    background: #231209 !important;
    border-bottom: 1px solid #5c3d2a !important;
  }

  header nav {
    background: transparent !important;
  }

  .logo,
  .nav-links a {
    color: #f3e3c3 !important;
  }

  .cartbtn {
    background: transparent !important;
    color: #f3e3c3 !important;
    border-color: #f3e3c3 !important;
  }

  #count {
    background: #f3e3c3 !important;
    color: #2b1911 !important;
  }

  .title h2 {
    color: #f3e3c3 !important;
  }

  .chip {
    background: #3b2418 !important;
    color: #f3e3c3 !important;
    border: 1px solid #5c3d2a !important;
  }

  .chip.on {
    background: #f3e3c3 !important;
    color: #2b1911 !important;
    border-color: #f3e3c3 !important;
  }

  .prod {
    background: #3b2418 !important;
    border: 1px solid #5c3d2a !important;
  }

  .prod .pic {
    background: repeating-linear-gradient(
      135deg,
      #3b2418 0 10px,
      #43291b 10px 20px
    ) !important;
  }

  .prod h3,
  .pbody h3 {
    color: #f6ecda !important;
  }

  .prod p,
  .pbody p,
  .vlabel {
    color: #d8c19c !important;
  }

  .price {
    color: #f6ecda !important;
  }

  .btn {
    background: #f3e3c3 !important;
    color: #2b1911 !important;
  }

  .vsel,
  .d-sel {
    background: #2b1911 !important;
    color: #f3e3c3 !important;
    border: 1px solid #5c3d2a !important;
  }

  .vsel option,
  .d-sel option {
    background: #3b2418;
    color: #f3e3c3;
  }

  .band {
    background: #1f110a !important;
    color: #f3e3c3 !important;
  }

  .band h3,
  .band p {
    color: #f3e3c3 !important;
  }

  footer {
    background: #1f110a !important;
    color: #d8c19c !important;
  }

  footer a,
  .footer-brand,
  .ar {
    color: #f3e3c3 !important;
  }

  /* cart drawer */

  .drawer {
    background: #2b1911 !important;
    color: #f3e3c3 !important;
  }

  .dh {
    border-color: #5c3d2a !important;
  }

  .dh h3,
  .x {
    color: #f3e3c3 !important;
  }

  .it {
    border-color: #5c3d2a !important;
    color: #f3e3c3 !important;
  }

  .it small {
    color: #cdb48f !important;
  }

  .qty button {
    background: transparent !important;
    color: #f3e3c3 !important;
    border-color: #f3e3c3 !important;
  }

  .dfoot {
    background: #34201a !important;
    border-color: #5c3d2a !important;
    color: #f3e3c3 !important;
  }

  .tot {
    color: #f6ecda !important;
  }

  .drawer input,
  .drawer textarea {
    background: #3b2418 !important;
    color: #f3e3c3 !important;
    border: 1px solid #5c3d2a !important;
  }

  .drawer input::placeholder,
  .drawer textarea::placeholder {
    color: #a98e6c !important;
  }

  .err {
    color: #ffb4a2 !important;
  }

  .empty {
    color: #cdb48f !important;
  }
</style>
</head>

<body>

<!-- HEADER -->

<header>
<nav>
  <a class="logo" href="#top">HIBA HENNA</a>

  <div class="nav-links">
    <a href="#top">Home</a>
    <a href="#shop">Shop</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </div>

  <button class="cartbtn" id="open">
    Cart <b id="count">0</b>
  </button>
</nav>
</header>


<main id="top">




<!-- PRODUCTS SECTION -->

<section id="shop">

  <div class="wrap">

    <div class="title">
      <h2>Our Products</h2>
    </div>

    <div class="chips" id="chips"></div>

    <div class="grid" id="grid"></div>

  </div>

</section>


<!-- BENEFITS SECTION -->

<section class="band" id="about">

  <div class="wrap perks">

    <div>
      <h3>Handmade</h3>
      <p>Small batches, mixed fresh.</p>
    </div>

    <div>
      <h3>Skin-Safe</h3>
      <p>Natural ingredients, no black henna.</p>
    </div>

    <div>
      <h3>Easy Ordering</h3>
      <p>Confirm your order on WhatsApp.</p>
    </div>

  </div>

</section>

</main>


<!-- FOOTER -->

<footer id="contact">

  <div class="ar" dir="rtl" lang="ar">
    هبة حناء
  </div>

  <div class="footer-brand">
    HIBA HENNA
  </div>

  Instagram:
  <a href="https://www.instagram.com/hibahenna.ae/" target="_blank" rel="noopener noreferrer">
    @hibahenna.ae
  </a>

  <p>© 2026 Hiba Henna. All rights reserved.</p>

</footer>


<!-- CART BACKGROUND -->

<div class="veil" id="veil"></div>


<!-- CART DRAWER -->

<aside class="drawer" id="drawer">

  <div class="dh">

    <h3>Your Cart</h3>

    <button class="x" id="close">×</button>

  </div>

  <div class="items" id="items"></div>

  <div class="dfoot" id="foot">

    <div class="tot">
      <span>Total</span>
      <span id="total"></span>
    </div>

    <input id="cn" placeholder="Your name">

    <input id="cp"
           placeholder="Phone number"
           inputmode="tel">

    <textarea id="ca"
              rows="2"
              placeholder="Delivery address"></textarea>

    <div class="err" id="err"></div>

    <button class="btn" id="order">
      Proceed to Order on WhatsApp
    </button>

  </div>

</aside>


<!-- FLOATING WHATSAPP ICON
     (replace 91XXXXXXXXXX with your India WhatsApp number) -->

<a href="https://wa.me/91XXXXXXXXXX"
   class="whatsapp-float"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="Chat on WhatsApp">

  <svg viewBox="0 0 32 32">

    <path d="M16.04 3C8.9 3 3.1 8.76 3.1 15.86c0 2.27.6 4.48 1.75 6.43L3 29l6.9-1.8a13 13 0 0 0 6.13 1.55h.01c7.13 0 12.93-5.77 12.93-12.87A12.8 12.8 0 0 0 16.04 3zm0 23.58h-.01a10.8 10.8 0 0 1-5.5-1.5l-.4-.24-4.1 1.07 1.1-3.98-.26-.41a10.65 10.65 0 0 1-1.65-5.66c0-5.92 4.86-10.74 10.83-10.74 2.89 0 5.6 1.12 7.64 3.15a10.62 10.62 0 0 1 3.17 7.58c0 5.92-4.86 10.73-10.82 10.73zm5.94-8.04c-.32-.16-1.9-.93-2.2-1.04-.3-.11-.51-.16-.73.16-.21.32-.84 1.04-1.03 1.25-.19.21-.38.24-.7.08-.32-.16-1.36-.5-2.59-1.6-.96-.85-1.61-1.9-1.8-2.22-.19-.32-.02-.49.14-.65.14-.14.32-.38.48-.57.16-.19.21-.32.32-.54.11-.21.05-.4-.03-.56-.08-.16-.73-1.75-1-2.4-.26-.63-.53-.54-.73-.55h-.62c-.21 0-.56.08-.86.4-.3.32-1.13 1.1-1.13 2.67s1.16 3.1 1.32 3.31c.16.21 2.28 3.46 5.52 4.85.77.33 1.37.53 1.84.68.77.24 1.47.21 2.02.13.62-.09 1.9-.78 2.17-1.54.27-.75.27-1.4.19-1.54-.08-.13-.3-.21-.62-.37z"/>

  </svg>

</a>


<script src="script.js"></script>

</body>
</html>
