<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hiba Henna Shop | هبة حناء</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->

<header>
<nav>
  <a class="logo" href="#top">HIBA HENNA</a>

  <div class="nav-links">
    <a href="#top">Home</a>
    <a href="#shop">Shop</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </div>

  <button class="cartbtn" id="open">
    Cart <b id="count">0</b>
  </button>
</nav>
</header>


<main id="top">

<!-- PRODUCTS SECTION -->

<section id="shop">

  <div class="wrap">

    <div class="title">
      <h2>Our Products</h2>
    </div>

    <div class="chips" id="chips"></div>

    <div class="grid" id="grid"></div>

  </div>

</section>


<!-- BENEFITS SECTION -->

<section class="band" id="about">

  <div class="wrap perks">

    <div>
      <h3>Handmade</h3>
      <p>Small batches, mixed fresh.</p>
    </div>

    <div>
      <h3>Skin-Safe</h3>
      <p>Natural ingredients, no black henna.</p>
    </div>

    <div>
      <h3>Easy Ordering</h3>
      <p>Confirm your order on WhatsApp.</p>
    </div>

  </div>

</section>

</main>


<!-- FOOTER -->

<footer id="contact">

  <div class="ar" dir="rtl" lang="ar">
    هبة حناء
  </div>

  <div class="footer-brand">
    HIBA HENNA
  </div>

  Instagram:
  <a href="https://www.instagram.com/hibahenna.ae/" target="_blank" rel="noopener noreferrer">
    @hibahenna.ae
  </a>

  <p>© 2026 Hiba Henna. All rights reserved.</p>

</footer>


<!-- CART BACKGROUND -->

<div class="veil" id="veil"></div>


<!-- CART DRAWER -->

<aside class="drawer" id="drawer">

  <div class="dh">

    <h3>Your Cart</h3>

    <button class="x" id="close">×</button>

  </div>

  <div class="items" id="items"></div>

  <div class="dfoot" id="foot">

    <div class="tot">
      <span>Total</span>
      <span id="total"></span>
    </div>

    <input id="cn" placeholder="Your name">

    <input id="cp"
           placeholder="Phone number"
           inputmode="tel">

    <textarea id="ca"
              rows="2"
              placeholder="Delivery address"></textarea>

    <div class="err" id="err"></div>

    <button class="btn" id="order">
      Order on WhatsApp
    </button>

  </div>

</aside>


<!-- FLOATING WHATSAPP ICON -->
